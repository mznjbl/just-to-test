<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand__mark">Klinik<span>Gajet</span></span>
      <span class="brand__tagline">{{ site.tagline }}</span>
    </a>

    <button class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="site-nav">
      Menu
    </button>

    <nav id="site-nav" class="nav">
      <ul>
        {% for w in site.wards %}
        <li><a href="{{ '/ward/' | append: w.slug | append: '/' | relative_url }}">{{ w.name }}</a></li>
        {% endfor %}
        <li><a href="{{ '/about/' | relative_url }}">Tentang</a></li>
      </ul>
    </nav>
  </div>
</header>
